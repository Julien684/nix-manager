[package]
name = "nix-manager"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
description = "Gestionnaire graphique (Qt6) de Nix sur Solus : installer Nix, rechercher, installer et mettre à jour des paquets"
license = "GPL-3.0-or-later"

[dependencies]
qtrs = "0.5.9"
cxx = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = 3
strip = true
